<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aqzivo — Plugins</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Ranglar va sozlamalar */
    :root {
      --bg: #05070f;
      --card-bg: rgba(18, 24, 43, 0.7);
      --purple: #8b5cf6;
      --purple-light: #c4b5fd;
      --blue: #3b82f6;
      --blue-light: #93c5fd;
      --cyan: #06b6d4;
      --text: #ffffff;
      --dim: #94a3b8;
      --border: rgba(139, 92, 246, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
      overflow-x: hidden;
      position: relative;
      perspective: 1000px; /* 3D effekt uchun */
    }

    /* Aylanadigan orqa fon nurlari (Glowing Orbs) */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: -1;
      animation: floatOrb 10s infinite alternate ease-in-out;
    }
    .orb-1 { top: -10%; left: -10%; width: 350px; height: 350px; background: rgba(139, 92, 246, 0.5); }
    .orb-2 { bottom: -10%; right: -10%; width: 300px; height: 300px; background: rgba(59, 130, 246, 0.4); animation-delay: -5s; }
    .orb-3 { top: 40%; left: 60%; width: 200px; height: 200px; background: rgba(6, 182, 212, 0.3); animation-delay: -2s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 60px) scale(1.1); }
    }

    .container { padding: 30px 16px; max-width: 600px; margin: 0 auto; position: relative; z-index: 1; }
    
    /* Sarlavha */
    .header { text-align: center; margin-bottom: 28px; }
    .logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(59, 130, 246, 0.15));
      padding: 8px 20px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 10px rgba(139, 92, 246, 0.2);
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
    }
    .logo { 
      font-size: 24px; 
      font-weight: 900; 
      background: linear-gradient(to right, #fff, #c4b5fd, #93c5fd); 
      -webkit-background-clip: text; 
      color: transparent; 
      letter-spacing: 1px; 
    }
    .subtitle { color: var(--dim); font-size: 13px; margin-top: 14px; font-weight: 500; letter-spacing: 0.5px; }

    /* Qidiruv */
    .search-box { margin-bottom: 24px; position: relative; transform-style: preserve-3d; }
    .search-box svg {
      position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; stroke: var(--purple-light);
    }
    .search-box input {
      width: 100%; padding: 16px 16px 16px 48px; border-radius: 16px;
      border: 1px solid var(--border); background: rgba(18, 24, 43, 0.6);
      color: white; font-size: 15px; outline: none; transition: 0.3s;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .search-box input:focus { 
      border-color: var(--purple); 
      box-shadow: 0 0 0 3px rgba(139,92,246,0.2), 0 8px 25px rgba(139,92,246,0.3); 
      background: rgba(18, 24, 43, 0.9);
    }

    /* Plaginlar ro'yxati */
    .grid { display: flex; flex-direction: column; gap: 16px; }
    
    /* 3D Kartochka */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      gap: 16px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transform-style: preserve-3d;
      animation: slideUp3D 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .card:active {
      transform: scale(0.98) translateZ(-10px);
      box-shadow: 0 5px 15px -5px rgba(0, 0, 0, 0.5);
    }

    @keyframes slideUp3D {
      from { opacity: 0; transform: translateY(30px) rotateX(-10deg); }
      to { opacity: 1; transform: translateY(0) rotateX(0); }
    }

    /* Kartochka chap chetidagi yorug'lik chizig'i */
    .card::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 5px; height: 100%;
      background: linear-gradient(to bottom, var(--purple), var(--cyan), var(--blue));
      box-shadow: 0 0 15px var(--purple);
    }

    /* Ikonka qutisi */
    .card-icon {
      width: 70px; height: 70px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(59,130,246,0.1));
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; flex-shrink: 0;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(139,92,246,0.2);
      transform: translateZ(20px); /* 3D hajm */
    }
    .card-icon img { width: 100%; height: 100%; object-fit: cover; }
    
    .card-content { flex: 1; min-width: 0; transform: translateZ(15px); }
    .card-title { 
      font-size: 17px; font-weight: 800; margin-bottom: 6px; 
      background: linear-gradient(to right, #fff, #e2e8f0);
      -webkit-background-clip: text; color: transparent;
    }
    .card-desc { font-size: 13px; color: var(--dim); margin-bottom: 12px; line-height: 1.5; }
    
    .card-version { 
      font-size: 11px; color: #fff; background: linear-gradient(135deg, rgba(139,92,246,0.5), rgba(59,130,246,0.5)); 
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 10px; border-radius: 20px; display: inline-block; 
      margin-bottom: 14px; font-weight: 700; letter-spacing: 0.5px;
      box-shadow: 0 2px 10px rgba(139,92,246,0.3);
    }
    
    /* 3D Tugma */
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color: white; font-weight: 800; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 6px 20px rgba(139,92,246,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
      transition: all 0.2s;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
      letter-spacing: 0.5px;
    }
    .btn:active { 
      transform: translateY(2px); 
      box-shadow: 0 2px 10px rgba(139,92,246,0.4), inset 0 1px 0 rgba(255,255,255,0.3); 
    }
    .btn svg { width: 18px; height: 18px; stroke: white; fill: none; stroke-width: 2.5; }

    /* Yuklanmoqda / Xato matni */
    .status-text { text-align: center; color: var(--dim); padding: 30px; font-size: 14px; font-weight: 500; }
    .status-error { color: #f87171; text-align: center; padding: 30px; font-weight: 600; }
  </style>
</head>
<body>
  <!-- Orqa fon nurlari -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="container">
    <!-- Sarlavha -->
    <div class="header">
      <div class="logo-wrap">
        <div class="logo-icon">📦</div>
        <div class="logo">Aqzivo</div>
      </div>
      <div class="subtitle">MCPE PLUGINS & ADDONS</div>
    </div>

    <!-- Qidiruv -->
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Plaginni qidirish..." oninput="renderPlugins()" />
    </div>
    
    <!-- Plaginlar ro'yxati -->
    <div class="grid" id="pluginGrid">
      <div class="status-text">Yuklanmoqda...</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // 🔴 SIZNING GITHUB HAVOLANGIZ
    const JSON_URL = "https://raw.githubusercontent.com/aqzivo/Aqzivo-plugins/main/Plugins.json";
    
    let allPlugins = [];

    async function loadData() {
      try {
        const res = await fetch(JSON_URL);
        allPlugins = await res.json();
        renderPlugins();
      } catch (e) {
        document.getElementById("pluginGrid").innerHTML = `<div class="status-error">Xatolik: Ma'lumot yuklanmadi.<br>Internet yoki havolani tekshiring.</div>`;
      }
    }

    function renderPlugins() {
      const grid = document.getElementById("pluginGrid");
      const query = document.getElementById("searchInput").value.toLowerCase();
      
      const filtered = allPlugins.filter(p => 
        p.name.toLowerCase().includes(query) || 
        p.desc.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="status-text">Hech narsa topilmadi 😔</div>`;
        return;
      }

      grid.innerHTML = filtered.map((p, index) => `
        <div class="card" style="animation-delay: ${index * 0.1}s">
          <div class="card-icon">${p.image ? `<img src="${p.image}" alt="${p.name}" />` : '📦'}</div>
          <div class="card-content">
            <div class="card-title">${p.name}</div>
            <div class="card-desc">${p.desc}</div>
            <div class="card-version">v${p.version}</div>
            <button class="btn" onclick="download('${p.download}')">
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Yuklab olish
            </button>
          </div>
        </div>
      `).join('');
    }

    function download(url) {
      if (!url) return;
      if (tg) {
        tg.openLink(url);
      } else {
        window.open(url, "_blank");
      }
    }

    loadData();
  </script>
</body>
</html>
