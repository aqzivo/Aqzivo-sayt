<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aqzivo — Plugins</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #080b14;
      color: #e8eaf6;
      min-height: 100vh;
      padding-bottom: 90px;
    }
    .container { padding: 20px 16px; max-width: 600px; margin: 0 auto; }
    
    /* Sarlavha */
    .header { text-align: center; margin-bottom: 24px; }
    .logo { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #a78bfa, #22d3ee); -webkit-background-clip: text; color: transparent; }
    .subtitle { color: #8b94b8; font-size: 13px; margin-top: 4px; }

    /* Qidiruv */
    .search-box { margin-bottom: 20px; position: relative; }
    .search-box input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1px solid rgba(139,92,246,0.2); background: #12172a;
      color: white; font-size: 14px; outline: none;
    }
    .search-box input:focus { border-color: #8b5cf6; }

    /* Kartochkalar */
    .grid { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: #12172a; border: 1px solid rgba(139,92,246,0.2);
      border-radius: 16px; padding: 16px; display: flex; gap: 14px;
    }
    .card-icon {
      width: 60px; height: 60px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(59,130,246,0.2));
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
    }
    .card-content { flex: 1; }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .card-desc { font-size: 12px; color: #8b94b8; margin-bottom: 8px; }
    .card-version { font-size: 11px; color: #60a5fa; background: rgba(59,130,246,0.15); padding: 3px 8px; border-radius: 10px; display: inline-block; margin-bottom: 10px; }
    
    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      color: white; font-weight: 600; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:active { opacity: 0.8; }

    /* Pastki menyu */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #0d1220; border-top: 1px solid rgba(139,92,246,0.2);
      display: flex; padding: 10px 0; padding-bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-btn {
      flex: 1; background: none; border: none; color: #8b94b8;
      font-size: 12px; font-weight: 600; padding: 8px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .nav-btn.active { color: #a78bfa; }
    .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* Men haqimda */
    .about { display: none; text-align: center; padding: 20px; background: #12172a; border-radius: 20px; }
    .about img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 16px; background: linear-gradient(135deg, #8b5cf6, #3b82f6); }
    .about h2 { font-size: 22px; margin-bottom: 8px; }
    .about p { font-size: 14px; color: #8b94b8; line-height: 1.6; }

    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">Aqzivo</div>
      <div class="subtitle">Minecraft PE Plugins</div>
    </div>

    <!-- Pluginlar sahifasi -->
    <div class="page active" id="page-plugins">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Plaginni qidirish..." oninput="renderPlugins()" />
      </div>
      <div class="grid" id="pluginGrid">
        <div style="text-align:center; color:#8b94b8; padding:20px;">Yuklanmoqda...</div>
      </div>
    </div>

    <!-- Men haqimda sahifasi -->
    <div class="page" id="page-about">
      <div class="about">
        <img src="https://ui-avatars.com/api/?name=Aqzivo&background=8b5cf6&color=fff&size=200" alt="Aqzivo" />
        <h2>Aqzivo</h2>
        <p><b>MCPE Plugin Developer</b><br/><br/>
        Salom! Men Minecraft PE uchun turli xil plaginlar va qo'shimchalar yasayman. 
        Asosan 0.14.3 va 0.15.10 versiyalari uchun ishlayman. Barcha plaginlarim bepul.</p>
      </div>
    </div>
  </div>

  <!-- Pastki menyu -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchPage('plugins', this)">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      Pluginlar
    </button>
    <button class="nav-btn" onclick="switchPage('about', this)">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Men haqimda
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // GitHub'dagi JSON havolasi
    const JSON_URL = "https://raw.githubusercontent.com/aqzivo/Aqzivo-plugins/main/Plugins.json";
    
    let allPlugins = [];

    // Ma'lumotlarni yuklash
    async function loadData() {
      try {
        const res = await fetch(JSON_URL);
        allPlugins = await res.json();
        renderPlugins();
      } catch (e) {
        document.getElementById("pluginGrid").innerHTML = `<div style="color:red; text-align:center;">Xatolik: Ma'lumot yuklanmadi</div>`;
      }
    }

    // Plaginlarni ekranga chiqarish
    function renderPlugins() {
      const grid = document.getElementById("pluginGrid");
      const query = document.getElementById("searchInput").value.toLowerCase();
      
      const filtered = allPlugins.filter(p => 
        p.name.toLowerCase().includes(query) || 
        p.desc.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="text-align:center; color:#8b94b8; padding:20px;">Hech narsa topilmadi</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="card">
          <div class="card-icon">📦</div>
          <div class="card-content">
            <div class="card-title">${p.name}</div>
            <div class="card-desc">${p.desc}</div>
            <div class="card-version">Versiya: ${p.version}</div>
            <button class="btn" onclick="download('${p.download}')">
              ⬇️ Yuklab olish
            </button>
          </div>
        </div>
      `).join('');
    }

    // Yuklab olish funksiyasi
    function download(url) {
      if (!url) return;
      if (tg) {
        tg.openLink(url);
      } else {
        window.open(url, "_blank");
      }
    }

    // Sahifalarni almashtirish
    function switchPage(pageName, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + pageName).classList.add('active');
      
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // Ishga tushirish
    loadData();
  </script>
</body>
</html>
